<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#18171A">
<title>Dealer Sports App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Dealer Sports">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#EEECE7;--surface:#FFFFFF;--field:#F6F4F0;--line:#D9D5CD;--ink:#18171A;--muted:#6A6660;--inv-bg:#18171A;--inv-ink:#F4F1EB;--green:#1E9A4A;--red:#C4402F;--yellow:#FFD400;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D0D0F;--surface:#161619;--field:#1D1D21;--line:#2B2B30;--ink:#ECE9E3;--muted:#8D8A85;--inv-bg:#ECE9E3;--inv-ink:#121214;--green:#46C86E;--red:#FF6B57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0D0F;--surface:#161619;--field:#1D1D21;--line:#2B2B30;--ink:#ECE9E3;--muted:#8D8A85;--inv-bg:#ECE9E3;--inv-ink:#121214;--green:#46C86E;--red:#FF6B57;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 6px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(34px,10vw,52px);line-height:.95;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;overflow-wrap:anywhere}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:600;font-size:15px;padding:8px 0;display:inline-block}
.sub{margin:4px 0 14px;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--inv-bg);background:var(--inv-bg);color:var(--inv-ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.x{all:unset;cursor:pointer;color:var(--red);font-size:14px;font-weight:600;padding:6px}
input:not([type=checkbox]),select{display:block;width:100%;min-height:46px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-size:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label>input,label>select{margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.list{display:grid;gap:10px}
.marca{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;cursor:pointer}
.marca b{font-size:19px;display:block}
.marca span{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:600}
.chip.on{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
.chip.off{text-decoration:line-through;opacity:.55}
.chip small{font-weight:500;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prod img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--field)}
.prod div{padding:8px 10px 10px}
.prod b{display:block;font-size:13px;line-height:1.25;font-weight:600}
.prod span{font-size:13px;color:var(--muted)}
.prod s{color:var(--muted);font-size:12px;margin-left:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;margin-top:4px}
.tag.no{background:var(--field);color:var(--muted)}
.tag.si{background:rgba(30,154,74,.14);color:var(--green)}
.tag.nuevo{background:var(--yellow);color:#111}
.bar{display:flex;gap:8px;align-items:center;margin:6px 0 12px;flex-wrap:wrap}
.bar input:not([type=checkbox]){flex:1;min-width:180px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);margin:0;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.monitor{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--green);box-shadow:0 0 0 4px rgba(30,154,74,.2)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}
.nav a{flex:1;max-width:180px;text-align:center;text-decoration:none;font-weight:600;font-size:14px;padding:8px;border-radius:12px;color:var(--muted)}
.nav a.on{background:var(--field);color:var(--ink)}
.nav a i{font-style:normal;display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--red);color:#fff;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 4px;font-size:20px;line-height:1.2}
.fotos{display:flex;gap:8px;overflow-x:auto;margin:10px 0;scroll-snap-type:x mandatory}
.fotos img{height:260px;border-radius:12px;scroll-snap-align:start;flex:none;background:var(--field)}
.opt{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.qty{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:2px}
.qty button{all:unset;cursor:pointer;width:36px;height:36px;text-align:center;font-size:20px;line-height:36px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.cart{margin-bottom:12px}
.cart h3{margin:0;font-size:17px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item img{width:52px;height:64px;object-fit:cover;border-radius:8px;background:var(--field)}
.item b{display:block;font-size:14px;line-height:1.25;font-weight:600}
.item span{font-size:13px;color:var(--muted)}
.tot{font-size:22px;font-weight:800}
.warn{color:var(--red);font-size:13px;font-weight:600}
.ok{color:var(--green);font-size:13px;font-weight:600}
.aviso{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.aviso small{color:var(--muted);display:block}
.note{font-size:13px;color:var(--muted);margin:8px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--inv-bg);color:var(--inv-ink);padding:12px 18px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav">
  <a href="#/" data-nav="marcas">Marcas</a>
  <a href="#/carritos" data-nav="carritos">Carritos</a>
  <a href="#/avisos" data-nav="avisos">Avisos</a>
  <a href="#/ajustes" data-nav="ajustes">Ajustes</a>
</nav>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="/precios.js"></script>
<script>
'use strict';
/* Drops: vigila las tiendas de las marcas (Shopify), arma carritos antes del drop
   y abre la página de pago de la marca con todo cargado. El pago lo haces tú.
   Todo se guarda solo en este aparato (localStorage). */
const KEY='drops_db';
const MARCAS_BASE=[
  {id:'youngla',nombre:'YoungLA',dom:'https://www.youngla.com',cols:['new-launch','restock']},
  {id:'darc',nombre:'Darc Sport',dom:'https://darcsport.com',cols:[]},
  {id:'dfyne',nombre:'DFYNE',dom:'https://dfyne.com',cols:[]},
  {id:'civil',nombre:'Civil Régime',dom:'https://civilregime.com',cols:[]},
  {id:'breathe',nombre:'Breathedivinity',dom:'https://breathedivinity.com',cols:[]},
  {id:'ci',nombre:'Controlled Insanity',dom:'https://controlledinsanity.com',cols:[]},
  // Gymshark no deja leer su tienda en vivo: sus lanzamientos vienen en gymshark.json (los cargo yo) y el pago va por su dominio de checkout
  {id:'gymshark',nombre:'Gymshark',dom:'https://www.gymshark.com',pago:'https://us.checkout.gymshark.com',archivo:'gymshark.json',cols:[],codigo:'EXTRA20'}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=v=>'$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const mxn=v=>'$'+Math.round(v||0).toLocaleString('es-MX');
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const img=(src,w)=>src?src+(src.includes('?')?'&':'?')+'width='+(w||400):'';

let DB=cargar();
function cargar(){
  let d={}; try{ d=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){}
  if(!Array.isArray(d.marcas)||!d.marcas.length) d.marcas=MARCAS_BASE.map(m=>Object.assign({codigo:''},m,{cols:m.cols.slice()}));
  if(!d.marcas.some(m=>m.id==='gymshark')&&!d.sinGym){ const g=MARCAS_BASE.find(m=>m.id==='gymshark'); d.marcas.push(Object.assign({},g,{cols:[]})); }
  if(!Array.isArray(d.carritos)) d.carritos=[];
  if(!Array.isArray(d.avisos)) d.avisos=[];
  if(!(d.tope>0)) d.tope=1200;
  if(!(d.cada>=15)) d.cada=30;
  if(!d.monitor) d.monitor={on:false,marcas:{}};
  return d;
}
function guardar(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast('No se pudo guardar en este aparato'); } }
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
function tc(){ try{ return window.PRECIOS?Number(PRECIOS.cargar().tc)||18:18; }catch(e){ return 18; } }
const marcaDe=id=>DB.marcas.find(m=>m.id===id);

/* ---------- lectura de las tiendas ---------- */
const CACHE=new Map(); // `${marca}|${fuente}` -> {t, prods}
async function getJSON(url){
  const r=await fetch(url,{cache:'no-store'});
  if(r.status===429) throw new Error('La marca pidió esperar un momento (demasiadas consultas). Intenta en un minuto.');
  if(!r.ok) throw new Error('La tienda respondió '+r.status);
  return r.json();
}
// fuente: '' = toda la tienda (lo más nuevo), o el handle de una colección
async function productos(m,fuente,fresco){
  const k=m.id+'|'+fuente, c=CACHE.get(k);
  if(c&&!fresco&&Date.now()-c.t<60000) return c.prods;
  if(m.archivo){ const j=await getJSON(m.archivo+'?v='+Date.now()); CACHE.set(k,{t:Date.now(),prods:j.products||[],nota:j.nota||''}); return j.products||[]; }
  const base=fuente?`${m.dom}/collections/${encodeURIComponent(fuente)}/products.json`:`${m.dom}/products.json`;
  let todos=[];
  for(let p=1;p<=(fuente?6:1);p++){
    const j=await getJSON(`${base}?limit=250&page=${p}`);
    const ps=j.products||[]; todos=todos.concat(ps);
    if(ps.length<250) break;
  }
  CACHE.set(k,{t:Date.now(),prods:todos});
  return todos;
}
async function colecciones(m){
  let out=[];
  for(let p=1;p<=6;p++){
    const j=await getJSON(`${m.dom}/collections.json?limit=250&page=${p}`);
    const cs=j.collections||[]; out=out.concat(cs);
    if(cs.length<250) break;
  }
  return out;
}
const disponible=p=>(p.variants||[]).some(v=>v.available);
const precioMin=p=>Math.min(...(p.variants||[]).map(v=>Number(v.price)||0));
const anteMax=p=>Math.max(0,...(p.variants||[]).map(v=>Number(v.compare_at_price)||0));
function nombreVar(p,v){ return (p.options||[]).map((o,i)=>v['option'+(i+1)]).filter(x=>x&&x!=='Default Title').join(' / '); }

/* ---------- vistas ---------- */
function ruta(){ return (location.hash||'#/').slice(1).split('/').filter(Boolean); }
window.addEventListener('hashchange',pintar);
function navOn(n){ document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===n));
  const nv=DB.avisos.filter(a=>!a.visto).length, a=document.querySelector('[data-nav=avisos]'); a.innerHTML='Avisos'+(nv?`<i>${nv}</i>`:''); }
function pintar(){
  const r=ruta();
  if(r[0]==='m'&&marcaDe(r[1])) return vistaMarca(marcaDe(r[1]),r[2]!=null?decodeURIComponent(r[2]):null);
  if(r[0]==='carritos') return vistaCarritos();
  if(r[0]==='avisos') return vistaAvisos();
  if(r[0]==='ajustes') return vistaAjustes();
  vistaInicio();
}

function barraMonitor(){
  const on=DB.monitor.on;
  return `<div class="monitor card"><span class="dot ${on?'on':''}"></span><div class="sp"><b>${on?'Monitor encendido':'Monitor apagado'}</b>
  <div class="note" style="margin:2px 0 0">${on?`Revisa cada ${DB.cada} s las colecciones elegidas y tus carritos. Deja esta pantalla abierta.`:'Préndelo antes del drop para que te avise al instante.'}</div></div>
  <button class="btn ${on?'ghost':'go'} sm" id="monBtn">${on?'Apagar':'Prender'}</button></div>`;
}
function ligarMonitor(){ const b=$('#monBtn'); if(b) b.onclick=()=>{ DB.monitor.on?apagarMonitor():prenderMonitor(); pintar(); }; }

function vistaInicio(){
  navOn('marcas');
  const nc=id=>DB.carritos.filter(c=>c.marca===id&&!c.lanzado).length;
  $('#app').innerHTML=`<div class="top"><h1>Dealer Sports App</h1></div>
  <p class="sub">Arma tus carritos antes del drop y, cuando abra, toca <b>Lanzar</b>: se abre la página de pago de la marca con todo cargado. Tú pagas.</p>
  ${barraMonitor()}
  <div class="list">${DB.marcas.map(m=>`<div class="card marca" data-m="${esc(m.id)}"><div><b>${esc(m.nombre)}</b>
    <span>${m.archivo?'Lanzamientos cargados':m.cols.length?esc(m.cols.length+(m.cols.length===1?' colección vigilada':' colecciones vigiladas')):'Toda la tienda'}${nc(m.id)?' · '+nc(m.id)+(nc(m.id)===1?' carrito listo':' carritos listos'):''}${m.codigo?' · código '+esc(m.codigo):''}</span></div><span style="font-size:24px">›</span></div>`).join('')}</div>
  <p class="note">Gymshark no deja leer su tienda en vivo: solo salen los lanzamientos que te deje cargados y el monitor no la vigila. Puedes agregar cualquier otra tienda Shopify en <b>Ajustes</b>.</p>`;
  document.querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>location.hash='#/m/'+el.dataset.m);
  ligarMonitor();
}

let FILTRO={q:'',solo:false};
async function vistaMarca(m,fuente){
  navOn('marcas');
  if(fuente==null) fuente=m.cols[0]||'';
  const tabs=m.archivo?[['','Lanzamientos']]:[...m.cols.map(h=>[h,h.replace(/-/g,' ')]),['','Todo lo nuevo']];
  $('#app').innerHTML=`<button class="back" onclick="location.hash='#/'">‹ Marcas</button>
  <div class="top"><h1>${esc(m.nombre)}</h1>${m.archivo?'':'<button class="btn ghost sm" id="colBtn">Elegir colecciones</button>'}</div>
  ${m.archivo?`<p class="note" id="notaArchivo">Esta marca no deja leer su tienda en vivo: aquí salen los lanzamientos que te dejé cargados. El monitor no la vigila; entra a la hora del drop y toca Lanzar.</p>`:''}
  <div class="row" style="margin-bottom:6px"><label style="flex:1;margin:0">Código de descuento <span style="opacity:.7">(se pone solo al lanzar)</span>
    <input id="codigo" value="${esc(m.codigo||'')}" placeholder="Ej. BLACKFRIDAY" autocomplete="off" autocapitalize="characters"></label></div>
  <div class="chips" id="tabs">${tabs.map(([h,t])=>`<button class="chip ${h===fuente?'on':''}" data-f="${esc(h)}">${esc(t)}</button>`).join('')}</div>
  <div class="bar"><input id="q" placeholder="Buscar por nombre o número de modelo" value="${esc(FILTRO.q)}">
    <label class="chk"><input type="checkbox" id="solo" ${FILTRO.solo?'checked':''}> Solo disponibles</label>
    <button class="btn ghost sm" id="recargar">Actualizar</button></div>
  <div id="prods"><p class="empty">Cargando…</p></div>`;
  $('#codigo').onchange=e=>{ m.codigo=e.target.value.trim(); guardar(); toast(m.codigo?'Código guardado: '+m.codigo:'Sin código'); };
  document.querySelectorAll('#tabs [data-f]').forEach(b=>b.onclick=()=>location.hash='#/m/'+m.id+'/'+encodeURIComponent(b.dataset.f));
  if($('#colBtn')) $('#colBtn').onclick=()=>elegirColecciones(m);
  const dibujar=ps=>{
    const q=FILTRO.q.trim().toLowerCase();
    let ls=ps.filter(p=>!q||(p.title+' '+(p.tags||[]).join(' ')+' '+p.handle).toLowerCase().includes(q));
    if(FILTRO.solo) ls=ls.filter(disponible);
    const nuevos=new Set((DB.monitor.nuevos||{})[m.id]||[]);
    $('#prods').innerHTML=ls.length?`<p class="note">${ls.length} ${ls.length===1?'producto':'productos'}</p><div class="grid">${ls.map(p=>{ const a=anteMax(p),pr=precioMin(p);
      return `<button class="prod" data-h="${esc(p.handle)}"><img loading="lazy" src="${esc(img(p.images&&p.images[0]&&p.images[0].src,300))}" alt=""><div><b>${esc(p.title)}</b>
      <span>${usd(pr)}</span>${a>pr?`<s>${usd(a)}</s>`:''}<br>${nuevos.has(p.handle)?'<span class="tag nuevo">NUEVO</span> ':''}<span class="tag ${disponible(p)?'si':'no'}">${disponible(p)?'Disponible':'Agotado / aún no sale'}</span></div></button>`; }).join('')}</div>`
      :`<p class="empty">${ps.length?'Ningún producto coincide.':'Esta colección está vacía por ahora. Cuando la marca suba el drop aparecerá aquí.'}</p>`;
    document.querySelectorAll('#prods [data-h]').forEach(b=>b.onclick=()=>abrirProducto(m,ps.find(p=>p.handle===b.dataset.h)));
  };
  let ps=[];
  const cargarPs=async fresco=>{ try{ ps=await productos(m,fuente,fresco); const c=CACHE.get(m.id+'|'+fuente); if(c&&c.nota&&$('#notaArchivo')) $('#notaArchivo').innerHTML='<b>'+esc(c.nota)+'</b><br>'+$('#notaArchivo').innerHTML; dibujar(ps); }catch(e){ $('#prods').innerHTML=`<p class="empty">${esc(e.message||e)}</p>`; } };
  $('#q').oninput=e=>{ FILTRO.q=e.target.value; dibujar(ps); };
  $('#solo').onchange=e=>{ FILTRO.solo=e.target.checked; dibujar(ps); };
  $('#recargar').onclick=()=>{ $('#prods').innerHTML='<p class="empty">Cargando…</p>'; cargarPs(true); };
  cargarPs(false);
}

async function elegirColecciones(m){
  abrirModal(`<h2>Colecciones de ${esc(m.nombre)}</h2><p class="note">Marca las que quieres ver y vigilar (las del drop). Las que tienen 0 suelen ser las que la marca llena justo cuando abre el drop.</p>
  <input id="cq" placeholder="Buscar colección (ej. black friday, restock, new)"><div id="clist" style="margin-top:10px"><p class="empty">Cargando…</p></div>
  <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" id="cok">Listo</button></div>`);
  let cs=[]; const sel=new Set(m.cols);
  const dib=()=>{ const q=$('#cq').value.trim().toLowerCase();
    const ls=cs.filter(c=>!q||(c.title+' '+c.handle).toLowerCase().includes(q)).sort((a,b)=>(sel.has(b.handle)-sel.has(a.handle))||String(b.updated_at).localeCompare(String(a.updated_at)));
    $('#clist').innerHTML=ls.slice(0,150).map(c=>`<label class="chk" style="display:flex;padding:8px 0;border-top:1px solid var(--line)"><input type="checkbox" data-c="${esc(c.handle)}" ${sel.has(c.handle)?'checked':''}>
      <span class="sp">${esc(c.title)} <small style="color:var(--muted)">(${c.products_count==null?'?':c.products_count})</small></span></label>`).join('')||'<p class="empty">Nada.</p>';
    document.querySelectorAll('#clist [data-c]').forEach(i=>i.onchange=()=>{ i.checked?sel.add(i.dataset.c):sel.delete(i.dataset.c); }); };
  $('#cq').oninput=dib;
  $('#cok').onclick=()=>{ m.cols=[...sel]; guardar(); cerrarModal(); location.hash='#/m/'+m.id; pintar(); };
  try{ cs=await colecciones(m); dib(); }catch(e){ $('#clist').innerHTML=`<p class="empty">${esc(e.message)}</p>`; }
}

/* ---------- producto ---------- */
function abrirProducto(m,p){
  if(!p) return;
  const ops=(p.options||[]).filter(o=>!(o.values||[]).every(v=>v==='Default Title'));
  const elec=ops.map((o,i)=>{ const v=(p.variants||[]).find(x=>x.available)||p.variants[0]; return v?v['option'+(i+1)]:o.values[0]; });
  let cant=1;
  const carts=()=>DB.carritos.filter(c=>c.marca===m.id&&!c.lanzado);
  const varSel=()=>(p.variants||[]).find(v=>ops.every((o,i)=>v['option'+(i+1)]===elec[i]));
  const dib=()=>{ const v=varSel();
    $('#sheet').innerHTML=`<div class="row"><h2 class="sp">${esc(p.title)}</h2><button class="x" style="color:var(--muted);font-size:22px" id="cerrar">✕</button></div>
    <div class="tot">${v?usd(v.price):usd(precioMin(p))} ${v&&Number(v.compare_at_price)>Number(v.price)?`<s style="font-size:15px;color:var(--muted);font-weight:500">${usd(v.compare_at_price)}</s>`:''}</div>
    <div class="fotos">${(p.images||[]).slice(0,12).map(i=>`<img loading="lazy" src="${esc(img(i.src,500))}" alt="">`).join('')}</div>
    ${ops.map((o,i)=>`<div class="opt">${esc(o.name)}</div><div class="chips">${o.values.map(val=>{ const hay=(p.variants||[]).some(x=>x['option'+(i+1)]===val&&x.available&&ops.every((oo,j)=>j===i||x['option'+(j+1)]===elec[j]));
      const vx=(p.variants||[]).find(x=>x['option'+(i+1)]===val&&ops.every((oo,j)=>j===i||x['option'+(j+1)]===elec[j])), q=vx&&vx.inventory_quantity;
      return `<button class="chip ${elec[i]===val?'on':''} ${hay?'':'off'}" data-o="${i}" data-v="${esc(val)}">${esc(val)}${q!=null&&i===ops.length-1?` <small>${q} pzs</small>`:''}</button>`; }).join('')}</div>`).join('')}
    ${(p.variants||[]).some(x=>x.inventory_quantity!=null)?'<p class="note">Las piezas son las que tenía la marca cuando se cargó el lanzamiento: sirven para saber qué talla se va a acabar primero.</p>':''}
    <p class="note">Las tachadas no están disponibles ahora. Puedes agregarlas igual: en drops que aún no abren, todo sale tachado.</p>
    ${v&&!v.available?'<p class="warn">Esta combinación está agotada o aún no sale.</p>':''}
    <div class="opt">Carrito</div>
    <select id="dest">${carts().map(c=>`<option value="${c.id}">${esc(c.nombre)} · ${usd(totalC(c))}</option>`).join('')}<option value="nuevo">+ Carrito nuevo</option></select>
    <div class="row" style="margin-top:14px"><div class="qty"><button id="menos">−</button><b id="cant">${cant}</b><button id="mas">+</button></div><span class="sp"></span>
      <button class="btn go" id="agregar" ${v?'':'disabled'}>Agregar al carrito</button></div>
    <p class="note"><a href="${esc(m.dom+'/products/'+p.handle)}" target="_blank" rel="noopener">Ver en la página de ${esc(m.nombre)} ↗</a></p>`;
    $('#cerrar').onclick=cerrarModal;
    document.querySelectorAll('#sheet [data-o]').forEach(b=>b.onclick=()=>{ elec[+b.dataset.o]=b.dataset.v; dib(); });
    $('#menos').onclick=()=>{ cant=Math.max(1,cant-1); $('#cant').textContent=cant; };
    $('#mas').onclick=()=>{ cant++; $('#cant').textContent=cant; };
    $('#agregar').onclick=()=>{ const v=varSel(); if(!v) return;
      let c=DB.carritos.find(x=>x.id===$('#dest').value);
      if(!c){ c=nuevoCarrito(m.id); }
      const it=c.items.find(x=>x.vid===v.id);
      if(it) it.qty+=cant; else c.items.push({vid:v.id,handle:p.handle,titulo:p.title,variante:nombreVar(p,v),precio:Number(v.price)||0,img:(v.featured_image&&v.featured_image.src)||(p.images&&p.images[0]&&p.images[0].src)||'',qty:cant,disp:!!v.available});
      guardar(); toast('Agregado a '+c.nombre+' · '+usd(totalC(c))+(totalC(c)>DB.tope?' · pasa tu tope, divídelo':''));
      cerrarModal(); };
  };
  abrirModal(''); dib();
}
function abrirModal(html){ $('#sheet').innerHTML=html; $('#modal').hidden=false; document.body.style.overflow='hidden'; }
function cerrarModal(){ $('#modal').hidden=true; document.body.style.overflow=''; }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') cerrarModal(); });

/* ---------- carritos ---------- */
const totalC=c=>c.items.reduce((s,i)=>s+i.precio*i.qty,0);
const prendasC=c=>c.items.reduce((s,i)=>s+i.qty,0);
function nuevoCarrito(marca){ const n=DB.carritos.filter(c=>c.marca===marca).length+1;
  const c={id:uid(),marca,nombre:'Carrito '+n,items:[],creado:Date.now(),lanzado:0}; DB.carritos.push(c); return c; }
function linkPago(c){ const m=marcaDe(c.marca); if(!m||!c.items.length) return '';
  return `${m.pago||m.dom}/cart/${c.items.map(i=>i.vid+':'+i.qty).join(',')}${m.codigo?'?discount='+encodeURIComponent(m.codigo):''}`; }
// reparte las prendas en carritos que no pasen del tope (por precio, una pieza a la vez)
function dividir(c){
  const piezas=[]; c.items.forEach(i=>{ for(let k=0;k<i.qty;k++) piezas.push(i); });
  piezas.sort((a,b)=>b.precio-a.precio);
  const grupos=[];
  for(const p of piezas){ let g=grupos.find(g=>g.t+p.precio<=DB.tope); if(!g){ g={t:0,items:new Map()}; grupos.push(g); } g.t+=p.precio; g.items.set(p.vid,(g.items.get(p.vid)||0)+1); }
  if(grupos.length<2) return toast('Este carrito ya no pasa de tu tope de '+usd(DB.tope));
  const idx=DB.carritos.indexOf(c), base=c.nombre;
  const nuevos=grupos.map((g,k)=>({id:uid(),marca:c.marca,nombre:base+' · '+(k+1)+' de '+grupos.length,creado:Date.now(),lanzado:0,
    items:[...g.items].map(([vid,qty])=>Object.assign({},c.items.find(i=>i.vid===vid),{qty}))}));
  DB.carritos.splice(idx,1,...nuevos); guardar(); toast('Dividido en '+grupos.length+' carritos'); pintar();
}
function vistaCarritos(){
  navOn('carritos');
  const pend=DB.carritos.filter(c=>!c.lanzado), lanz=DB.carritos.filter(c=>c.lanzado);
  const t=tc();
  const tarjeta=c=>{ const m=marcaDe(c.marca), tot=totalC(c), nd=c.items.filter(i=>!i.disp).length;
    return `<div class="card cart" data-c="${c.id}"><div class="row"><div class="sp"><h3>${esc(c.nombre)}</h3><span class="note">${esc(m?m.nombre:c.marca)} · ${prendasC(c)} ${prendasC(c)===1?'prenda':'prendas'}${c.lanzado?' · lanzado '+new Date(c.lanzado).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}):''}</span></div>
      <div style="text-align:right"><div class="tot">${usd(tot)}</div><span class="note">≈ ${mxn(tot*t)} MXN de costo</span></div></div>
      ${tot>DB.tope?`<p class="warn">Pasa tu tope de ${usd(DB.tope)}. Toca "Dividir".</p>`:''}
      ${c.items.length?(nd?`<p class="warn">${nd} ${nd===1?'prenda aparece':'prendas aparecen'} agotada o sin salir todavía.</p>`:'<p class="ok">Todo disponible la última vez que se revisó.</p>'):''}
      ${c.items.map(i=>`<div class="item"><img src="${esc(img(i.img,120))}" alt=""><div><b>${esc(i.titulo)}</b><span>${esc(i.variante)} · ${usd(i.precio)}${i.disp?'':' · <span class="warn">agotado</span>'}</span></div>
        <div class="row" style="gap:4px"><div class="qty"><button data-q="-1" data-v="${i.vid}">−</button><b>${i.qty}</b><button data-q="1" data-v="${i.vid}">+</button></div></div></div>`).join('')||'<p class="note">Vacío. Entra a una marca y agrega prendas.</p>'}
      <div class="row" style="margin-top:12px">
        ${c.items.length?`<a class="btn go" href="${esc(linkPago(c))}" target="_blank" rel="noopener" data-lanzar="${c.id}">${c.lanzado?'Lanzar de nuevo':'Lanzar'}</a>`:''}
        ${c.items.length?`<button class="btn ghost sm" data-copiar="${c.id}">Copiar link</button>`:''}
        ${tot>DB.tope?`<button class="btn ghost sm" data-dividir="${c.id}">Dividir</button>`:''}
        <button class="btn ghost sm" data-renombrar="${c.id}">Nombre</button>
        <span class="sp"></span><button class="x" data-borrar="${c.id}">Eliminar</button></div></div>`; };
  $('#app').innerHTML=`<div class="top"><h1>Carritos</h1>${pend.length>1?'<button class="btn go sm" id="modoDrop">Modo drop</button>':''}</div>
  <p class="sub">Tope por carrito: <b>${usd(DB.tope)}</b> (cámbialo en Ajustes). <b>Lanzar</b> abre la página de pago de la marca con tus prendas${'' } y tu código. Revisa y paga ahí.</p>
  ${barraMonitor()}
  ${pend.length?pend.map(tarjeta).join(''):'<p class="empty">No tienes carritos listos. Entra a una marca, toca una prenda y agrégala.</p>'}
  ${lanz.length?`<h2 style="font-size:18px;margin:24px 0 10px">Ya lanzados</h2>${lanz.map(tarjeta).join('')}`:''}`;
  const C=id=>DB.carritos.find(c=>c.id===id);
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const c=C(b.closest('[data-c]').dataset.c), it=c.items.find(i=>String(i.vid)===b.dataset.v);
    it.qty+=Number(b.dataset.q); if(it.qty<1) c.items.splice(c.items.indexOf(it),1); guardar(); pintar(); });
  document.querySelectorAll('[data-lanzar]').forEach(a=>a.addEventListener('click',()=>{ const c=C(a.dataset.lanzar); c.lanzado=Date.now(); guardar(); setTimeout(pintar,300); }));
  document.querySelectorAll('[data-copiar]').forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(linkPago(C(b.dataset.copiar))); toast('Link copiado'); }catch(e){ prompt('Copia el link:',linkPago(C(b.dataset.copiar))); } });
  document.querySelectorAll('[data-dividir]').forEach(b=>b.onclick=()=>dividir(C(b.dataset.dividir)));
  document.querySelectorAll('[data-renombrar]').forEach(b=>b.onclick=()=>{ const c=C(b.dataset.renombrar), n=prompt('Nombre del carrito (ej. Pedido Juan):',c.nombre); if(n&&n.trim()){ c.nombre=n.trim(); guardar(); pintar(); } });
  document.querySelectorAll('[data-borrar]').forEach(b=>b.onclick=()=>{ const c=C(b.dataset.borrar); if(confirm('¿Eliminar "'+c.nombre+'"?')){ DB.carritos.splice(DB.carritos.indexOf(c),1); guardar(); pintar(); } });
  const md=$('#modoDrop'); if(md) md.onclick=modoDrop;
  ligarMonitor();
}
// Modo drop: un botón grande por carrito, en orden, para abrirlos uno tras otro lo más rápido posible
function modoDrop(){
  const pend=DB.carritos.filter(c=>!c.lanzado&&c.items.length);
  abrirModal(`<div class="row"><h2 class="sp">Modo drop</h2><button class="x" style="color:var(--muted);font-size:22px" onclick="cerrarModal()">✕</button></div>
  <p class="note">Toca cada botón en orden: cada uno abre una pestaña con la página de pago de ese carrito. Paga en cada pestaña.</p>
  <div class="list">${pend.map((c,k)=>`<a class="btn go full" style="min-height:56px;font-size:17px" href="${esc(linkPago(c))}" target="_blank" rel="noopener" data-l="${c.id}">${k+1}. ${esc(c.nombre)} · ${usd(totalC(c))}</a>`).join('')}</div>`);
  document.querySelectorAll('#sheet [data-l]').forEach(a=>a.addEventListener('click',()=>{ const c=DB.carritos.find(x=>x.id===a.dataset.l); c.lanzado=Date.now(); guardar(); a.style.opacity='.45'; a.textContent='✓ '+a.textContent; }));
}

/* ---------- avisos ---------- */
function vistaAvisos(){
  DB.avisos.forEach(a=>a.visto=true); guardar(); navOn('avisos');
  $('#app').innerHTML=`<div class="top"><h1>Avisos</h1>${DB.avisos.length?'<button class="btn ghost sm" id="limpiar">Borrar todos</button>':''}</div>
  ${barraMonitor()}
  <div class="list">${DB.avisos.slice().reverse().map(a=>`<div class="card aviso"><div><b>${esc(a.txt)}</b><small>${new Date(a.t).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'medium'})}</small></div>${a.url?`<a class="btn sm" href="${esc(a.url)}">${esc(a.btn||'Ver')}</a>`:''}</div>`).join('')||'<p class="empty">Aquí aparecen los avisos del monitor: productos nuevos, restocks y carritos que ya se pueden comprar.</p>'}</div>`;
  const l=$('#limpiar'); if(l) l.onclick=()=>{ DB.avisos=[]; guardar(); pintar(); };
  ligarMonitor();
}

/* ---------- ajustes ---------- */
function vistaAjustes(){
  navOn('ajustes');
  $('#app').innerHTML=`<div class="top"><h1>Ajustes</h1></div>
  <div class="card"><label>Tope por carrito (dólares)<input id="tope" inputmode="decimal" value="${DB.tope}"></label>
  <label>El monitor revisa cada (segundos)<input id="cada" inputmode="numeric" value="${DB.cada}"></label>
  <p class="note">No lo bajes de 20 segundos: si se consulta muy seguido, la marca bloquea un rato.</p>
  <button class="btn" id="avisosPerm">Permitir avisos en este aparato</button></div>
  <h2 style="font-size:18px;margin:24px 0 10px">Marcas</h2>
  <div class="list">${DB.marcas.map(m=>`<div class="card row"><div class="sp"><b>${esc(m.nombre)}</b><div class="note" style="margin:0">${esc(m.dom)}</div></div><button class="x" data-quitar="${esc(m.id)}">Quitar</button></div>`).join('')}</div>
  <div class="card" style="margin-top:10px"><b>Agregar una tienda Shopify</b>
    <label style="margin-top:10px">Nombre<input id="nn" placeholder="Ej. AYBL"></label>
    <label>Página de la tienda<input id="nd" placeholder="Ej. https://www.aybl.com" inputmode="url" autocapitalize="off"></label>
    <button class="btn" id="agregarM">Agregar</button></div>
  <p class="note" style="margin-top:16px">Todo se guarda solo en este aparato. No hay contraseñas ni pagos aquí: el pago siempre lo haces tú en la página de la marca.</p>`;
  $('#tope').onchange=e=>{ const v=parseFloat(e.target.value); if(v>0){ DB.tope=v; guardar(); toast('Tope: '+usd(v)); } };
  $('#cada').onchange=e=>{ const v=Math.max(20,parseInt(e.target.value)||30); DB.cada=v; e.target.value=v; guardar(); if(DB.monitor.on){ apagarMonitor(); prenderMonitor(); } toast('Cada '+v+' segundos'); };
  $('#avisosPerm').onclick=async()=>{ if(!('Notification' in window)) return toast('Este aparato no permite avisos; sonará y vibrará con la app abierta.'); const r=await Notification.requestPermission(); toast(r==='granted'?'Avisos permitidos':'No se permitieron los avisos'); };
  document.querySelectorAll('[data-quitar]').forEach(b=>b.onclick=()=>{ const m=marcaDe(b.dataset.quitar); if(confirm('¿Quitar '+m.nombre+'? Sus carritos también se borran.')){ if(m.id==='gymshark') DB.sinGym=true; DB.marcas=DB.marcas.filter(x=>x!==m); DB.carritos=DB.carritos.filter(c=>c.marca!==m.id); guardar(); pintar(); } });
  $('#agregarM').onclick=async()=>{ const n=$('#nn').value.trim(); let d=$('#nd').value.trim();
    if(!n||!d) return toast('Escribe el nombre y la página');
    if(!/^https?:\/\//.test(d)) d='https://'+d; d=d.replace(/\/+$/,'');
    try{ const j=await getJSON(d+'/products.json?limit=1'); if(!j.products) throw 0; }catch(e){ return toast('Esa tienda no deja leer sus productos (no es Shopify o lo tiene bloqueado)'); }
    DB.marcas.push({id:uid().toLowerCase(),nombre:n,dom:d,cols:[],codigo:''}); guardar(); toast(n+' agregada'); pintar(); };
}

/* ---------- monitor ---------- */
let TIMER=null, ANTES=new Map(), WAKE=null, AUDIO=null;
function beep(){ try{ AUDIO=AUDIO||new (window.AudioContext||window.webkitAudioContext)(); const o=AUDIO.createOscillator(), g=AUDIO.createGain();
  o.connect(g); g.connect(AUDIO.destination); o.frequency.value=880; g.gain.setValueAtTime(.25,AUDIO.currentTime); g.gain.exponentialRampToValueAtTime(.001,AUDIO.currentTime+.6); o.start(); o.stop(AUDIO.currentTime+.6); }catch(e){} }
function avisar(txt,url,btn){
  DB.avisos.push({t:Date.now(),txt,url:url||'',btn:btn||'',visto:false}); if(DB.avisos.length>200) DB.avisos=DB.avisos.slice(-200); guardar();
  beep(); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){}
  try{ if('Notification' in window&&Notification.permission==='granted') new Notification('Dealer Sports App',{body:txt,icon:'icon-180.png',tag:txt}); }catch(e){}
  toast(txt); const on=document.querySelector('.nav a.on'); navOn(on?on.dataset.nav:'');
}
async function prenderMonitor(){
  DB.monitor.on=true; guardar(); beep();
  try{ if('wakeLock' in navigator) WAKE=await navigator.wakeLock.request('screen'); }catch(e){}
  ANTES=new Map(); await vuelta(true);
  TIMER=setInterval(()=>vuelta(false),DB.cada*1000);
}
function apagarMonitor(){ DB.monitor.on=false; guardar(); clearInterval(TIMER); TIMER=null; try{ WAKE&&WAKE.release(); }catch(e){} WAKE=null; }
// una revisión: colecciones vigiladas de cada marca + los productos de tus carritos
async function vuelta(primera){
  for(const m of DB.marcas){
    if(m.archivo) continue; // sin datos en vivo (Gymshark)
    const enCarrito=DB.carritos.filter(c=>c.marca===m.id&&!c.lanzado&&c.items.length);
    const fuentes=m.cols.length?m.cols.slice():(enCarrito.length?['']:[]);
    if(!fuentes.length&&!enCarrito.length) continue;
    const vistos=new Map();
    for(const f of fuentes){
      try{ (await productos(m,f,true)).forEach(p=>vistos.set(p.handle,p)); }catch(e){ continue; }
      await new Promise(r=>setTimeout(r,700));
    }
    // prendas de los carritos que no salieron en las colecciones: se leen una por una
    for(const h of new Set(enCarrito.flatMap(c=>c.items.map(i=>i.handle)))){
      if(vistos.has(h)) continue;
      try{ const j=await getJSON(`${m.dom}/products/${encodeURIComponent(h)}.js`);
        vistos.set(h,{handle:h,title:j.title,variants:(j.variants||[]).map(v=>({id:v.id,available:v.available,price:(v.price/100).toFixed(2)}))}); }catch(e){}
      await new Promise(r=>setTimeout(r,400));
    }
    const prev=ANTES.get(m.id);
    if(prev&&!primera){
      const nuevos=[];
      for(const [h,p] of vistos){
        const a=prev.get(h);
        if(!a){ nuevos.push(p); continue; }
        if(!disponible(a)&&disponible(p)) avisar(`${m.nombre}: ya se puede comprar ${p.title}`,'#/m/'+m.id,'Ver');
      }
      if(nuevos.length){ DB.monitor.nuevos=DB.monitor.nuevos||{}; DB.monitor.nuevos[m.id]=[...new Set([...(DB.monitor.nuevos[m.id]||[]),...nuevos.map(p=>p.handle)])].slice(-300);
        avisar(`${m.nombre}: ${nuevos.length===1?'subió '+nuevos[0].title:'subieron '+nuevos.length+' productos nuevos'}`,'#/m/'+m.id,'Ver'); }
    }
    // disponibilidad de cada prenda de tus carritos; si un carrito queda completo, avisa para lanzarlo
    for(const c of enCarrito){
      const antes=c.items.every(i=>i.disp);
      c.items.forEach(i=>{ const p=vistos.get(i.handle); if(!p) return; const v=(p.variants||[]).find(x=>x.id===i.vid); if(v){ i.disp=!!v.available; if(v.price) i.precio=Number(v.price)||i.precio; } });
      const ahora=c.items.every(i=>i.disp);
      if(ahora&&!antes&&!primera) avisar(`${c.nombre} (${m.nombre}) ya está disponible completo: ¡lánzalo!`,'#/carritos','Ir a carritos');
    }
    ANTES.set(m.id,vistos); guardar();
  }
  if(['carritos','avisos'].includes(ruta()[0])&&$('#modal').hidden) pintar();
}
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'&&DB.monitor.on&&!WAKE){ try{ WAKE=await navigator.wakeLock.request('screen'); }catch(e){} } });

if(DB.monitor.on){ DB.monitor.on=false; } // al abrir la app el monitor empieza apagado: préndelo tú (así el sonido funciona)
pintar();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }); }
</script>
